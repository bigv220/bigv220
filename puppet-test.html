<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luna 2D Puppet Test</title><style>
body{margin:0;background:#3a2934;color:#fff3e5;font:14px sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.stage{width:min(100%,520px);aspect-ratio:9/16;margin:auto;position:relative;overflow:hidden;border:1px solid #c18a82;border-radius:20px;background:url('video/assets/luna-sky-v2.png') center/cover}.puppet{position:absolute;inset:0;transform-origin:50% 80%;animation:breathe 2.8s ease-in-out infinite}.head{position:absolute;width:76%;left:12%;top:10%;z-index:3;animation:head 3.6s ease-in-out infinite}.body{position:absolute;width:82%;left:9%;bottom:3%;z-index:1}..arm-mic{position:absolute;width:39%;left:5%;bottom:17%;z-index:4;transform-origin:80% 80%;animation:mic 2.1s ease-in-out infinite}.arm-free{position:absolute;width:26%;right:5%;bottom:12%;z-index:4;transform-origin:30% 70%;animation:hand 3.2s ease-in-out infinite}.caption{position:absolute;z-index:8;top:5%;left:0;right:0;text-align:center;font-size:20px;font-weight:800;text-shadow:0 2px 8px #4d2837}.hint{text-align:center;color:#e7c8c0}.btn{display:block;margin:15px auto;padding:10px 16px;border:0;border-radius:10px;background:#f2b7aa;color:#4b2e37;font-weight:800;cursor:pointer}.mouth{position:absolute;z-index:7;width:9%;left:45%;top:32%;opacity:0}.stage.playing .mouth.open{opacity:1;animation:mouth .35s infinite alternate}.stage.playing .mouth.smile{opacity:.25}.eye{position:absolute;z-index:7;width:19%;top:25%;opacity:0}.eye.left{left:29%}.eye.right{right:29%}.stage.playing .eye.closed{opacity:1;animation:wink 3.2s infinite}.stage.playing .eye.open{opacity:.0}@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes head{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.3deg)}}@keyframes mic{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg) translateY(-5px)}}@keyframes hand{0%,100%{transform:rotate(1deg)}50%{transform:rotate(-5deg) translateY(-8px)}}@keyframes mouth{from{transform:scaleY(.7)}to{transform:scaleY(1.15)}}@keyframes wink{0%,72%,100%{opacity:0}78%,84%{opacity:1}}
</style></head><body><div class="wrap"><h1>Luna 2D Puppet 动作测试</h1><div class="stage" id="stage"><div class="caption">《流星糖》· Luna 演唱测试</div><div class="puppet"><img class="body" src="video/assets/puppet/body-hoodie.png"><img class="head" src="video/assets/puppet/head-face.png"><img class="arm-mic" src="video/assets/puppet/arm-microphone.png"><img class="arm-free" src="video/assets/puppet/arm-free.png"><img class="eye left open" src="video/assets/puppet/eyes-and-mouths.png"><img class="eye right open" src="video/assets/puppet/eyes-and-mouths.png"><img class="eye left closed" src="video/assets/puppet/eyes-and-mouths.png"><img class="eye right closed" src="video/assets/puppet/eyes-and-mouths.png"><img class="mouth open" src="video/assets/puppet/eyes-and-mouths.png"><img class="mouth smile" src="video/assets/puppet/eyes-and-mouths.png"></div></div><button class="btn" id="toggle">▶ 播放动作测试</button><p class="hint">这页用于验证分层素材的动作方向；确认后再绑定音乐和歌词。</p></div><script>const s=document.getElementById('stage'),b=document.getElementById('toggle');b.onclick=()=>{s.classList.toggle('playing');b.textContent=s.classList.contains('playing')?'❚❚ 暂停动作':'▶ 播放动作测试'};</script></body></html>
